<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmeGod - Random Video Chat with Strangers</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            background-color: #F9FAFB; /* brand-light-bg */
            transition: background-color 0.3s ease-in-out;
        }
        html.dark {
            background-color: #0D0D0D; /* brand-dark */
        }
        .tv-static-container {
            background-color: #121215;
            overflow: hidden;
        }
        .dark .tv-static-container {
            background-color: #0d0d10;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'outfit': ['Outfit', 'sans-serif'],
              'inter': ['Inter', 'sans-serif'],
              'serif': ['"Playfair Display"', 'Georgia', 'serif'],
              'display': ['"Playfair Display"', 'Georgia', 'serif'],
            },
            colors: {
              'brand-dark': '#0D0D0D',
              'brand-gray': '#1B1B1B',
              'brand-light-gray': '#8F8F8F',
              'brand-light-bg': '#F9FAFB',
              'brand-light-card': '#FFFFFF',
              'brand-light-text': '#4B5563',
              'brand-dark-text': '#111827',
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.8s ease-out forwards',
              'message-out': 'message-out-kf 0.25s ease-out forwards',
              'message-in': 'message-in-kf 0.4s ease-out 0.2s forwards',
              'typing-dot-1': 'typing-dot-kf 1s infinite 0s',
              'typing-dot-2': 'typing-dot-kf 1s infinite 0.2s',
              'typing-dot-3': 'typing-dot-kf 1s infinite 0.4s',
              'scroll-ticker': 'scroll-ticker-kf 40s linear infinite',
              'scan-beam': 'scan-beam-kf 2.2s ease-in-out infinite',
              'soundbar-1': 'soundbar-kf 0.9s ease-in-out infinite 0s',
              'soundbar-2': 'soundbar-kf 0.9s ease-in-out infinite 0.15s',
              'soundbar-3': 'soundbar-kf 0.9s ease-in-out infinite 0.3s',
              'soundbar-4': 'soundbar-kf 0.9s ease-in-out infinite 0.45s',
              'soundbar-5': 'soundbar-kf 0.9s ease-in-out infinite 0.6s',
              'soundbar-6': 'soundbar-kf 0.9s ease-in-out infinite 0.25s',
            },
            keyframes: {
              'scan-beam-kf': {
                '0%, 100%': { top: '8%', opacity: '0.2' },
                '50%': { top: '88%', opacity: '0.95' },
              },
              'soundbar-kf': {
                '0%, 100%': { height: '6px', opacity: '0.4' },
                '50%': { height: '24px', opacity: '1' },
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'message-out-kf': {
                '0%': { opacity: '0', transform: 'scale(0.8) translateY(10px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              'message-in-kf': {
                '0%': { opacity: '0', transform: 'scale(0.8) translateY(10px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              'typing-dot-kf': {
                '0%, 60%, 100%': { transform: 'translateY(0)' },
                '30%': { transform: 'translateY(-4px)' },
              },
              'scroll-ticker-kf': {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "socket.io-client": "https://aistudiocdn.com/socket.io-client@^4.8.1",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.4",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "i18next": "https://aistudiocdn.com/i18next@^25.6.0",
    "react-i18next": "https://aistudiocdn.com/react-i18next@^16.1.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <!-- Global Gradient Background -->
    <div class="fixed top-0 left-0 -z-50 w-screen h-screen opacity-50 dark:opacity-40 transition-opacity duration-500 pointer-events-none">
        <div class="absolute top-[-20vh] left-[-30vw] w-[80vw] h-[80vh] bg-pink-500/20 dark:bg-pink-900/20 blur-[150px] rounded-full"></div>
        <div class="absolute bottom-[-10vh] right-[-20vw] w-[70vw] h-[70vh] bg-orange-500/20 dark:bg-orange-900/20 blur-[150px] rounded-full"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
